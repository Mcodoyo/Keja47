<title>KejaChapChap - Landlord Manager</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f4f6f8}
.login-screen{display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#0d6efd,#6610f2);padding:20px}
.login-box{background:white;padding:30px;border-radius:15px;width:100%;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,0.2);text-align:center}
.password-wrapper{position:relative;width:100%;margin-bottom:15px}
.password-wrapper input{width:100%;padding:14px 45px 14px 14px;border:2px solid #ddd;border-radius:10px;font-size:16px;text-transform:uppercase}
.eye-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:20px;cursor:pointer;padding:5px 8px}
.login-box button.login-main{width:100%;padding:14px;background:#0d6efd;color:white;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
.app{display:none;padding:15px;max-width:900px;margin:auto}
.header{background:white;padding:15px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:15px}
.stat-card{background:white;padding:15px;border-radius:12px;text-align:center}
.controls{background:white;padding:15px;border-radius:12px;margin-bottom:15px}
.controls input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-bottom:10px}
.btn{flex:1;padding:12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.btn-add{background:#198754;color:white} .btn-pdf{background:#6c757d;color:white} .btn-admin{background:#6610f2;color:white}
.tenant-card{background:white;padding:12px;border-radius:10px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;border-left:5px solid red}
.tenant-card.paid{border-left-color:green}
.admin-panel{display:none;background:#fff3cd;border:2px solid #ffc107;padding:15px;border-radius:12px;margin-bottom:15px}
.copyright{text-align:center;padding:25px 15px;margin-top:30px;color:#888;font-size:13px;border-top:1px solid #ddd;background:white;border-radius:12px}
</style>
</head>

  <div class="login-box">
