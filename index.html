<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KejaChapChap</title><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script><style>body{margin:0;font-family:system-ui;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px}.c{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:400px}input,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ddd}button{background:#667eea;color:#fff;border:0;font-weight:bold}.hidden{display:none}.tenant{border:1px solid #eee;padding:10px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between}</style></head><body><div id="login" class="c"><h2 style="text-align:center;margin:0">KejaChapChap</h2><p style="text-align:center;color:#666;font-size:12px">CLOUD EDITION 🇰🇪 KSH 600/30 Days</p><input id="p" type="password" placeholder="Password NALIAKA4050"><button onclick="login()">INGIA / LOGIN</button><p style="text-align:center;font-size:11px">Lipa KSH 600 → M-Pesa 0718255742<br><b>Victor Odoyo - Garissa</b></p><div id="err" style="color:red;font-size:13px;text-align:center"></div></div><div id="app" class="c hidden"><h2 style="margin:0">KejaChapChap</h2><p id="status" style="font-size:12px">● Cloud</p><input id="n" placeholder="Tenant Name"><input id="ph" placeholder="Phone"><input id="h" placeholder="House No"><input id="r" placeholder="Rent"><button onclick="addT()">+ Add Tenant</button><div id="list"></div><button onclick="location.reload()" style="background:#eee;color:#333">Logout</button></div><script>
let db=null; try{ firebase.initializeApp({projectId:"kenya-rentals"}); db=firebase.firestore(); }catch(e){console.log("fb not ready",e)}
let user=""; let tenants=[]; 
function login(){
 let v=document.getElementById('p').value.trim().toUpperCase();
 if(v==="NALIAKA4050"){user="MASTER"; showApp(); return;}
 if(!db) return document.getElementById('err').innerText="Go create Firestore DB in Firebase first! Build > Firestore > Create > Test Mode";
 db.collection("subs").doc(v).get().then(d=>{
  if(!d.exists) document.getElementById('err').innerText="Wrong password. Lipa KSH 600";
  else {user=v; showApp();}
 }).catch(()=>document.getElementById('err').innerText="Finish Firestore setup in Firebase");
}
function showApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');if(db) load(); else {document.getElementById('status').innerText="● Local Mode (Create Firestore for Cloud)"; let s=localStorage.getItem('tenants_'+user); if(s) tenants=JSON.parse(s); render();}}
function load(){if(!db) return; db.collection("tenants").where("owner","==",user).onSnapshot(s=>{tenants=[]; s.forEach(d=>tenants.push({id:d.id,...d.data()})); render();});}
function render(){let h=""; tenants.forEach(t=>{h+=`<div class="tenant"><span><b>${t.name}</b><br><small>${t.house} - ${t.paid?'PAID':'UNPAID'}</small></span><span><button style="width:auto;padding:5px 8px;background:${t.paid?'#ff6b6b':'#1dd1a1'}" onclick="toggleP('${t.id}',${!t.paid})">${t.paid?'X':'✓'}</button> <button style="width:auto;padding:5px 8px;background:#ee5253" onclick="delT('${t.id}')">Del</button></span></div>`}); document.getElementById('list').innerHTML=h||"No tenants";}
function addT(){let o={owner:user,name:document.getElementById('n').value,phone:document.getElementById('ph').value,house:document.getElementById('h').value,rent:document.getElementById('r').value,paid:false}; if(!o.name||!o.house) return alert("Need name & house"); if(db) db.collection("tenants").add(o); else {tenants.push(o); localStorage.setItem('tenants_'+user,JSON.stringify(tenants)); render();} document.getElementById('n').value=""; document.getElementById('h').value="";}
function toggleP(id,v){if(db) db.collection("tenants").doc(id).update({paid:v}); else {let t=tenants.find(x=>x.id==id); if(t) t.paid=v;}}
function delT(id){if(!confirm("Delete?")) return; if(db) db.collection("tenants").doc(id).delete(); else {tenants=tenants.filter(x=>x.id!=id); localStorage.setItem('tenants_'+user,JSON.stringify(tenants)); render();}}
</script></body></html>
