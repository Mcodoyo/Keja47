<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KejaChapChap</title><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script><style>body{margin:0;font-family:system-ui;background:#f1f2f6}.wrap{max-width:480px;margin:0 auto;background:#fff;min-height:100vh;padding:14px}.btn{padding:8px 12px;border-radius:8px;border:0;font-weight:700;cursor:pointer}.hidden{display:none}#loginWrap{max-width:400px;margin:60px auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.15)}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0}.add{background:#0f8a5f;color:#fff;padding:13px;border-radius:10px;border:0;font-weight:800;width:100%;cursor:pointer}</style></head><body>
<div id="loginWrap"><h2 style="text-align:center">KejaChapChap<br><small style="font-size:12px">Victor Odoyo - Nairobi</small></h2><input id="pass" type="password" placeholder="Enter Password"><button type="button" class="add" id="loginBtn" onclick="doLogin()">LOGIN</button><p id="err" style="color:red;text-align:center;font-size:13px"></p><p style="text-align:center;font-size:11px;color:#888;margin-top:10px">If button not working, refresh page</p></div>
<div id="mainApp" class="wrap hidden"><h2>KejaChapChap</h2><p id="who"></p><button onclick="location.reload()">Logout</button><div id="list"></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyCdzaaBzqI-jx9HHPke-lR7fW0naBlUZtE",authDomain:"kenya-rentals.firebaseapp.com",projectId:"kenya-rentals",storageBucket:"kenya-rentals.firebasestorage.app",messagingSenderId:"251007486844",appId:"1:251007486844:web:76e889f990e2030a2b32f9"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
const MASTER="NALIAKA4050";
window.doLogin=function(){
 let p=document.getElementById('pass').value.trim().toUpperCase();
 if(!p){ document.getElementById('err').innerText="Enter password"; return; }
 if(p===MASTER){ document.getElementById('loginWrap').classList.add('hidden'); document.getElementById('mainApp').classList.remove('hidden'); document.getElementById('who').innerText="MASTER - Victor Odoyo"; return; }
 db.collection("subscriptions").doc(p).get().then(d=>{
   if(!d.exists){ document.getElementById('err').innerText="Invalid password"; return; }
   document.getElementById('loginWrap').classList.add('hidden'); document.getElementById('mainApp').classList.remove('hidden'); document.getElementById('who').innerText="Landlord: "+p;
 }).catch(e=>{ document.getElementById('err').innerText="Error: "+e.message; });
};
document.getElementById('pass').addEventListener('keypress',function(e){ if(e.key==='Enter'){ doLogin(); }});
</script></body></html>
