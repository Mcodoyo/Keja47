<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KejaChapChap - Victor Odoyo</title><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script><style>body{margin:0;font-family:system-ui;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:12px}.card{max-width:430px;margin:0 auto;background:#fff;border-radius:18px;padding:18px}h1{text-align:center;margin:0}.sub{text-align:center;color:#666;font-size:12px;margin:4px 0 12px}input,button{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid #ddd}button{background:#667eea;color:#fff;border:0;font-weight:700}.hidden{display:none}.tenant{border:1px solid #eee;border-radius:12px;padding:10px;margin:7px 0;display:flex;justify-content:space-between}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}.stats div{background:#f5f7ff;padding:10px;border-radius:10px;text-align:center;font-size:13px}.green{color:#00b894;font-weight:700}.red{color:#d63031;font-weight:700}</style></head><body><div id="login" class="card"><h1>KejaChapChap</h1><div class="sub">CLOUD EDITION 🇰🇪<br>By Victor Odoyo - Garissa</div><input id="pass" type="password" placeholder="Password"><button onclick="doLogin()">INGIA / LOGIN</button><div style="text-align:center;margin-top:12px;font-size:12px">Lipa KSH 600 M-Pesa<br><b>0718255742 Victor Odoyo</b></div><div id="err" style="color:red;text-align:center;font-size:13px;margin-top:8px"></div></div><div id="app" class="card hidden"><h1>KejaChapChap</h1><div class="sub" id="cloudStatus">● Cloud</div><div class="stats"><div><b id="cTotal">0</b><br>Wote</div><div><b id="cPaid">0</b><br>Wamelipa</div><div><b id="cUnpaid">0</b><br>Deni</div></div><input id="tName" placeholder="Jina"><input id="tPhone" placeholder="Simu"><input id="tHouse" placeholder="Nyumba No"><input id="tRent" type="number" placeholder="Kodi"><button onclick="addTenant()">+ Hifadhi Cloud</button><div id="list"></div><button onclick="location.reload()" style="background:#eee;color:#333;margin-top:10px">Toka</button></div><script>
const firebaseConfig={apiKey:"AIzaSyCdzaaBzqI-jx9HHPke-lR7fW0naBlUZtE",authDomain:"kenya-rentals.firebaseapp.com",projectId:"kenya-rentals",storageBucket:"kenya-rentals.firebasestorage.app",messagingSenderId:"251007486844",appId:"1:251007486844:web:76e889f990e2030a2b32f9"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore(); let curUser="", tenants=[]; const MASTER="NALIAKA4050";
function doLogin(){let p=document.getElementById('pass').value.trim().toUpperCase(); if(!p) return document.getElementById('err').innerText="Weka password"; if(p===MASTER){curUser="MASTER"; enterApp(); return;} db.collection("subscriptions").doc(p).get().then(d=>{if(!d.exists) return document.getElementById('err').innerText="Password sio sahihi. Lipa KSH 600"; curUser=p; enterApp();});}
function enterApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('cloudStatus').innerText="● Cloud Connected - "+curUser; db.collection("tenants").where("owner","==",curUser).onSnapshot(s=>{tenants=[]; s.forEach(doc=>tenants.push({id:doc.id,...doc.data()})); render();});}
function render(){let h="",pa=0,un=0; tenants.forEach(t=>{if(t.paid) pa++; else un++; h+=`<div class="tenant"><div><b>${t.name}</b> - ${t.house}<br><small>KSH ${t.rent} <span class="${t.paid?'green':'red'}">${t.paid?'PAID':'UNPAID'}</span></small></div><div><button style="width:auto;padding:6px" onclick="db.collection('tenants').doc('${t.id}').update({paid:${!t.paid}})">${t.paid?'X':'✓'}</button> <button style="width:auto;padding:6px;background:#d63031" onclick="db.collection('tenants').doc('${t.id}').delete()">Del</button></div></div>`}); document.getElementById('list').innerHTML=h||"Hakuna"; document.getElementById('cTotal').innerText=tenants.length; document.getElementById('cPaid').innerText=pa; document.getElementById('cUnpaid').innerText=un;}
function addTenant(){let o={owner:curUser,name:document.getElementById('tName').value,phone:document.getElementById('tPhone').value,house:document.getElementById('tHouse').value,rent:document.getElementById('tRent').value,paid:false}; if(!o.name||!o.house) return alert("Jina na Nyumba"); db.collection("tenants").add(o).then(()=>{document.getElementById('tName').value="";document.getElementById('tHouse').value="";});}
</script></body></html>
