<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keja47 - Garissa Rentals Manager</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f5f7fb;color:#1a1a1a}
.header{background:#0f172a;color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:20px}.header span{color:#38bdf8}
.btn{background:#0ea5e9;color:white;border:none;padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer}
.btn-green{background:#16a34a}.btn-red{background:#dc2626}.btn-outline{background:white;border:1px solid #ddd;color:#333}
.container{max-width:1100px;margin:20px auto;padding:0 15px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.card{background:white;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.stat h3{font-size:26px}.stat p{color:#64748b;font-size:13px}
.houses{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px}
.house-card{border-left:5px solid #e5e7eb}.house-card.paid{border-left-color:#16a34a}.house-card.unpaid{border-left-color:#dc2626}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;color:white}.badge.paid{background:#16a34a}.badge.unpaid{background:#dc2626}
.house-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:20;padding:15px}
.modal.show{display:flex}.modal-box{background:white;border-radius:16px;padding:20px;width:100%;max-width:420px}
.input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin:8px 0}
.login-screen{height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;padding:20px}
.login-box{background:white;padding:30px;border-radius:16px;width:100%;max-width:380px;text-align:center}
.hidden{display:none}.top-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
</style>
</head>
<body>
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h2>Keja47 <span style="color:#0ea5e9">Garissa</span></h2>
    <p style="color:#64748b;margin:10px 0 20px">Landlord Rental Manager</p>
    <input id="loginUser" class="input" placeholder="Username (admin)" value="admin">
    <input id="loginPass" class="input" type="password" placeholder="Password (1234)" value="1234">
    <button class="btn" style="width:100%;margin-top:10px" onclick="login()">INGIA / LOGIN</button>
    <p style="font-size:12px;margin-top:15px;color:#94a3b8">Demo: admin / 1234<br>Call: 0718 255 742</p>
  </div>
</div>
<div id="app" class="hidden">
  <div class="header"><h1>Keja47 <span>Garissa</span></h1><button class="btn btn-outline" style="padding:6px 12px" onclick="logout()">Logout</button></div>
  <div class="container">
    <div class="top-actions"><button class="btn" onclick="openModal()">+ Ongeza Nyumba / Tenant</button><button class="btn btn-outline" onclick="shareWhatsApp()">Share kwa WhatsApp</button></div>
    <div class="stats">
      <div class="card stat"><h3 id="totalHouses">0</h3><p>Jumla ya Nyumba</p></div>
      <div class="card stat"><h3 id="paidCount" style="color:#16a34a">0</h3><p>WalioLipa GREEN</p></div>
      <div class="card stat"><h3 id="unpaidCount" style="color:#dc2626">0</h3><p>Hawajalipa RED</p></div>
      <div class="card stat"><h3 id="totalRent">Ksh 0</h3><p>Pesa Imeingia</p></div>
    </div>
    <div id="houses" class="houses"></div>
  </div>
</div>
<div id="addModal" class="modal"><div class="modal-box">
    <h3>Ongeza Tenant</h3>
    <input id="houseName" class="input" placeholder="Plot / House No. (e.g. Bulla Plot A1)">
    <input id="tenantName" class="input" placeholder="Jina la Tenant">
    <input id="phone" class="input" placeholder="Phone ya Tenant">
    <input id="rent" class="input" type="number" placeholder="Rent (e.g. 5000)">
    <select id="status" class="input"><option value="paid">Amelipa GREEN</option><option value="unpaid">Hajalipa RED</option></select>
    <div style="display:flex;gap:10px;margin-top:10px"><button class="btn" style="flex:1" onclick="saveHouse()">Hifadhi</button><button class="btn btn-outline" style="flex:1" onclick="closeModal()">Cancel</button></div>
</div></div>
<script>
let houses = JSON.parse(localStorage.getItem('keja47') || '[]');
function login(){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render();}
function logout(){location.reload();}
function openModal(){document.getElementById('addModal').classList.add('show');}
function closeModal(){document.getElementById('addModal').classList.remove('show');}
function saveHouse(){
  let h=document.getElementById('houseName').value.trim();
  let t=document.getElementById('tenantName').value.trim();
  let ph=document.getElementById('phone').value.trim();
  let r=parseInt(document.getElementById('rent').value)||0;
  let s=document.getElementById('status').value;
  if(!h||!t){alert('Jaza Plot na Jina!');return;}
  houses.push({id:Date.now(), house:h, tenant:t, phone:ph, rent:r, status:s});
  localStorage.setItem('keja47', JSON.stringify(houses));
  closeModal(); render();
  document.getElementById('houseName').value='';document.getElementById('tenantName').value='';
}
function toggleStatus(id){houses=houses.map(x=> x.id===id ? {...x, status: x.status==='paid'?'unpaid':'paid'} : x);localStorage.setItem('keja47', JSON.stringify(houses));render();}
function deleteHouse(id){if(confirm('Futa huyu tenant?')){houses=houses.filter(x=>x.id!==id);localStorage.setItem('keja47', JSON.stringify(houses));render();}}
function render(){
  let c=document.getElementById('houses'); c.innerHTML='';
  let paid=0, unpaid=0, total=0;
  houses.forEach(h=>{
    if(h.status==='paid'){paid++; total+=h.rent} else unpaid++;
    c.innerHTML+=`<div class="card house-card ${h.status}">
      <div class="house-top"><b>${h.house}</b><span class="badge ${h.status}">${h.status==='paid'?'GREEN':'RED'}</span></div>
      <p><b>Tenant:</b> ${h.tenant}</p><p><b>Phone:</b> ${h.phone||'-'}</p><p><b>Rent:</b> Ksh ${h.rent.toLocaleString()}</p>
      <div class="actions">
        <button class="btn ${h.status==='paid'?'btn-red':'btn-green'}" onclick="toggleStatus(${h.id})">${h.status==='paid'?'Mark RED':'Mark GREEN'}</button>
        <button class="btn btn-outline" onclick="deleteHouse(${h.id})">Futa</button>
      </div>
    </div>`;
  });
  document.getElementById('totalHouses').innerText=houses.length;
  document.getElementById('paidCount').innerText=paid;
  document.getElementById('unpaidCount').innerText=unpaid;
  document.getElementById('totalRent').innerText='Ksh '+total.toLocaleString();
  if(houses.length===0){c.innerHTML='<div class="card" style="text-align:center;color:#94a3b8">Hakuna tenant bado. Bonyeza + Ongeza Nyumba</div>';}
}
function shareWhatsApp(){
  let text=`Keja47 Garissa Report Total:${houses.length} Paid:${document.getElementById('paidCount').innerText} Unpaid:${document.getElementById('unpaidCount').innerText} Link: https://mcodoy.github.io/Keja47`;
  window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
}
</script>
</body>
  </html>
