<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KejaChapChap - Victor Odoyo</title><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:12px}.card{max-width:450px;margin:0 auto;background:#fff;border-radius:18px;padding:18px;box-shadow:0 12px 35px rgba(0,0,0,.25)}h1{text-align:center;margin:0 0 2px} .sub{text-align:center;color:#666;font-size:12px;margin-bottom:12px}input,button{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid #ddd;font-size:14px}button{background:#667eea;color:#fff;border:0;font-weight:700;cursor:pointer}.hidden{display:none}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}.stats div{background:#f5f7ff;padding:10px;border-radius:10px;text-align:center;font-size:12px;line-height:1.2}.tenant{border:1px solid #eee;border-radius:12px;padding:10px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}.green{color:#00b894;font-weight:700}.red{color:#d63031;font-weight:700}.small{font-size:11px;color:#888}.row{display:flex;gap:8px}.row button{flex:1}</style></head><body>
<div id="login" class="card"><h1>KejaChapChap</h1><div class="sub">CLOUD EDITION - KSH 600 / 30 Days<br>By Victor Odoyo - Garissa</div><input id="pass" type="password" placeholder="Enter Password"><button onclick="doLogin()">LOGIN</button><div style="text-align:center;margin-top:10px;font-size:12px">Pay KSH 600 via M-Pesa<br><b>0718255742 - Victor Odoyo</b></div><div id="err" style="color:#d63031;text-align:center;font-size:13px;margin-top:8px"></div></div>

<div id="app" class="card hidden"><h1>KejaChapChap</h1><div class="sub" id="cloudStatus">● Cloud Connected</div>
<div class="stats"><div><b id="cTotal">0</b><br>Total Tenants</div><div><b id="cPaid">0</b><br>Paid</div><div><b id="cUnpaid">0</b><br>Unpaid</div></div>
<div style="background:#eef2ff;padding:10px;border-radius:10px;text-align:center;margin:8px 0">Total Monthly Rent: <b>KSH <span id="cRent">0</span></b></div>
<input id="search" placeholder="Search tenant or house..." oninput="render()">
<input id="tName" placeholder="Tenant Full Name"><input id="tPhone" placeholder="Phone Number 07..."><div class="row"><input id="tHouse" placeholder="House No. e.g A1"><input id="tRent" type="number" placeholder="Rent KSH"></div>
<button onclick="addTenant()">+ Save to Cloud</button>
<div id="list" style="margin-top:12px"></div>
<div class="row" style="margin-top:12px"><button onclick="location.reload()" style="background:#dfe6e9;color:#333">Logout</button><button onclick="window.print()" style="background:#00b894">Print List</button></div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyCdzaaBzqI-jx9HHPke-lR7fW0naBlUZtE",authDomain:"kenya-rentals.firebaseapp.com",projectId:"kenya-rentals",storageBucket:"kenya-rentals.firebasestorage.app",messagingSenderId:"251007486844",appId:"1:251007486844:web:76e889f990e2030a2b32f9"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
let curUser="", tenants=[]; const MASTER="NALIAKA4050";
function doLogin(){let p=document.getElementById('pass').value.trim().toUpperCase(); if(!p) return err("Enter password"); if(p===MASTER){curUser="MASTER"; enter(); return;} db.collection("subscriptions").doc(p).get().then(d=>{if(!d.exists) return err("Invalid password. Pay KSH 600 to 0718255742"); if(d.data().expiry && Date.now()>d.data().expiry) return err("Expired. Pay KSH 600 again"); curUser=p; enter();}).catch(()=>err("Create Firestore DB first: Firebase Console > Build > Firestore > Create Database > Test Mode"));}
function err(m){document.getElementById('err').innerText=m;}
function enter(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('cloudStatus').innerText="● Cloud Connected - "+curUser; db.collection("tenants").where("owner","==",curUser).onSnapshot(s=>{tenants=[]; s.forEach(doc=>tenants.push({id:doc.id,...doc.data()})); render();});}
function render(){let q=document.getElementById('search').value.toLowerCase(); let filtered=tenants.filter(t=>(t.name+t.house+t.phone).toLowerCase().includes(q)); let h=""; let paid=0, unpaid=0, totalRent=0; tenants.forEach(t=>{totalRent+=Number(t.rent||0); if(t.paid) paid++; else unpaid++;}); filtered.forEach(t=>{h+=`<div class="tenant"><div><b>${t.name}</b> - House ${t.house}<br><span class="small">${t.phone||''} | KSH ${t.rent||0} <span class="${t.paid?'green':'red'}">${t.paid?'PAID':'UNPAID'}</span></span></div><div style="text-align:right"><button style="width:auto;padding:6px 10px;background:${t.paid?'#ff7675':'#00b894'};font-size:12px" onclick="togglePaid('${t.id}',${!t.paid})">${t.paid?'Unpay':'Mark Paid'}</button><br><button style="width:auto;padding:4px 8px;background:#636e72;margin-top:4px;font-size:11px" onclick="delTenant('${t.id}')">Delete</button></div></div>`;}); document.getElementById('list').innerHTML=h||"<p style='text-align:center;color:#999'>No tenants found</p>"; document.getElementById('cTotal').innerText=tenants.length; document.getElementById('cPaid').innerText=paid; document.getElementById('cUnpaid').innerText=unpaid; document.getElementById('cRent').innerText=totalRent.toLocaleString();}
function addTenant(){let name=document.getElementById('tName').value.trim(), phone=document.getElementById('tPhone').value.trim(), house=document.getElementById('tHouse').value.trim(), rent=document.getElementById('tRent').value.trim(); if(!name||!house) return alert("Name and House No required"); db.collection("tenants").add({owner:curUser,name,phone,house,rent:Number(rent||0),paid:false,created:Date.now()}).then(()=>{document.getElementById('tName').value="";document.getElementById('tPhone').value="";document.getElementById('tHouse').value="";document.getElementById('tRent').value="";});}
function togglePaid(id,status){db.collection("tenants").doc(id).update({paid:status});}
function delTenant(id){if(confirm("Delete this tenant permanently?")) db.collection("tenants").doc(id).delete();}
</script></body></html>
