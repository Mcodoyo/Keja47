<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KejaChapChap - Victor Odoyo</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f1f2f6;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;background:#fff;min-height:100vh;padding:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.top h1{margin:0;font-size:26px;font-weight:900}.sub{font-size:13px;color:#666;margin-top:2px}
.btn{padding:8px 14px;border-radius:8px;border:0;font-weight:700;font-size:13px;cursor:pointer}
.admin{background:#7c3aed;color:#fff}.logout{background:#ef4444;color:#fff}.renew{background:#0f8a5f;color:#fff}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.cardStat{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;text-align:center}
.cardStat b{font-size:20px;display:block}.cardStat span{font-size:13px;color:#444}
.formCard{border:1px solid #e5e7eb;border-radius:14px;padding:12px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input{width:100%;padding:12px;border:1px solid #e5e7eb;border-radius:10px;margin:5px 0;font-size:14px;background:#f9fafb}
.add{background:#0f8a5f;color:#fff;padding:13px;border-radius:10px;border:0;font-weight:800;width:100%;cursor:pointer}
.pdf{background:#6b7280;color:#fff;padding:13px;border-radius:10px;border:0;font-weight:700;width:100%;cursor:pointer}
.search{width:100%;padding:12px;border:1px solid #e5e7eb;border-radius:10px;margin:10px 0}
.tenant{border:1px solid #eee;border-radius:12px;padding:10px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
.hidden{display:none}#loginWrap{max-width:400px;margin:60px auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.center{text-align:center}.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);padding:12px;overflow:auto;z-index:99}
</style>
</head>
<body>
<div id="loginWrap"><h1 style="text-align:center;margin:0">KejaChapChap</h1><p class="center" style="font-size:12px;color:#666;margin:6px 0 14px">By Victor Odoyo - Garissa<br>M-Pesa 0718255742 - KSH 600/30 Days</p><input id="pass" type="password" placeholder="Enter Password"><button class="add" onclick="doLogin()">LOGIN</button><p id="err" style="color:#ef4444;text-align:center;font-size:13px;margin-top:10px"></p></div>
<div id="mainApp" class="wrap hidden">
<div class="top"><div><h1>KejaChapChap</h1><div class="sub" id="who"></div></div><div style="display:flex;gap:6px"><button id="adminBtn" class="btn admin hidden" onclick="openAdmin()">👑 ADMIN</button><button class="btn logout" onclick="location.reload()">Logout</button></div></div>
<div class="grid4"><div class="cardStat"><b id="sHouses">0</b><span>Total Houses</span></div><div class="cardStat"><b id="sCollected">KSH 0</b><span>Collected</span></div><div class="cardStat"><b id="sNotPaid">0</b><span>Not Paid</span></div><div class="cardStat"><b id="sExpected">KSH 0</b><span>Expected</span></div></div>
<div class="formCard"><div class="row2"><input id="fHouse" placeholder="House No"><input id="fName" placeholder="Tenant Name"></div><div class="row2"><input id="fRent" type="number" placeholder="Rent KSH"><input id="fPhone" placeholder="Phone"></div><div class="row2" style="margin-top:8px"><button class="add" onclick="addTenant()">+ ADD TENANT</button><button class="pdf" onclick="window.print()">PDF</button></div><input id="search" class="search" placeholder="🔍 Search..." oninput="render()"></div>
<div id="list" style="text-align:center;padding:30px;color:#888">No tenants</div>
<div class="center" style="font-size:11px;color:#aaa;margin-top:20px">KejaChapChap @ 2026 - Victor Odoyo</div>
</div>
<div id="adminBox" class="modal hidden"><div class="wrap" style="border-radius:16px;min-height:auto">
<h2 style="margin:0">👑 Admin Panel</h2><p style="font-size:12px;color:#666">Victor Odoyo - Track sharing here</p>
<input id="landlordName" placeholder="Landlord Full Name">
<input id="landlordPhone" placeholder="Phone 07...">
<input id="landlordLocation" placeholder="Location">
<input id="newPass" placeholder="Password e.g. JOHN600" style="border:2px solid #7c3aed">
<input id="newDays" type="number" value="30">
<button class="add" onclick="createSub()">Create Landlord</button>
<p id="adminMsg" style="font-size:13px;text-align:center;color:#0f8a5f;font-weight:700"></p>
<div id="subsList" style="margin-top:14px"></div>
<button class="pdf" style="margin-top:14px" onclick="closeAdmin()">Close</button>
</div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyCdzaaBzqI-jx9HHPke-lR7fW0naBlUZtE",authDomain:"kenya-rentals.firebaseapp.com",projectId:"kenya-rentals",storageBucket:"kenya-rentals.firebasestorage.app",messagingSenderId:"251007486844",appId:"1:251007486844:web:76e889f990e2030a2b32f9"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
let curUser="", tenants=[]; const MASTER="NALIAKA4050";
function doLogin(){let p=document.getElementById('pass').value.trim().toUpperCase(); if(!p) return document.getElementById('err').innerText="Enter password"; if(p===MASTER){curUser="MASTER"; enter(); return;} db.collection("subscriptions").doc(p).get().then(d=>{if(!d.exists) return document.getElementById('err').innerText="Invalid. Pay KSH 600 to 0718255742"; if(d.data().expiry && Date.now()>d.data().expiry) return document.getElementById('err').innerText="Expired. Pay again 600"; curUser=p; enter();}).catch(()=>document.getElementById('err').innerText="Create Firestore DB in Test Mode");}
function enter(){
 document.getElementById('loginWrap').classList.add('hidden');
 document.getElementById('mainApp').classList.remove('hidden');
 document.getElementById('who').innerText=curUser==="MASTER"?"Victor Master - MASTER":curUser;
 if(curUser==="MASTER"){
   document.getElementById('adminBtn').classList.remove('hidden');
 } else {
   document.getElementById('adminBtn').classList.add('hidden');
   db.collection("logins").add({password:curUser, time:Date.now(), date:new Date().toLocaleString(), device:navigator.userAgent.substring(0,90)}).catch(()=>{});
   db.collection("subscriptions").doc(curUser).update({lastLogin:Date.now(), lastSeen:new Date().toLocaleString(), loginCount: firebase.firestore.FieldValue.increment(1)}).catch(()=>{});
 }
 db.collection("tenants").where("owner","==",curUser).onSnapshot(s=>{tenants=[]; s.forEach(d=>tenants.push({id:d.id,...d.data()})); render();});
}
function render(){let q=document.getElementById('search').value.toLowerCase(); let f=tenants.filter(t=>(t.name+t.house).toLowerCase().includes(q)); let total=tenants.length, collected=0, notPaid=0, expected=0; tenants.forEach(t=>{let r=Number(t.rent||0); expected+=r; if(t.paid) collected+=r; else notPaid++;}); sHouses.innerText=total; sCollected.innerText="KSH "+collected.toLocaleString(); sNotPaid.innerText=notPaid; sExpected.innerText="KSH "+expected.toLocaleString(); let h=""; f.forEach(t=>{h+=`<div class="tenant"><div style="text-align:left"><b>House ${t.house}</b> - ${t.name}<br><small>KSH ${t.rent} | ${t.phone||''} <span style="font-weight:800;color:${t.paid?'#0f8a5f':'#ef4444'}">${t.paid?'PAID':'NOT PAID'}</span></small></div><div style="display:flex;gap:4px"><button class="btn" style="background:${t.paid?'#ef4444':'#0f8a5f'};color:#fff;padding:6px 10px" onclick="db.collection('tenants').doc('${t.id}').update({paid:${!t.paid}})">${t.paid?'Unpay':'Paid'}</button><button class="btn" style="background:#eee;padding:6px 10px" onclick="if(confirm('Delete?')) db.collection('tenants').doc('${t.id}').delete()">Del</button></div></div>`}); list.innerHTML=h||"No tenants";}
function addTenant(){let house=fHouse.value.trim(), name=fName.value.trim(), rent=fRent.value.trim(), phone=fPhone.value.trim(); if(!house||!name) return alert("House No and Name required"); db.collection("tenants").add({owner:curUser,house,name,rent:Number(rent||0),phone,paid:false,created:Date.now()}).then(()=>{fHouse.value="";fName.value="";fRent.value="";fPhone.value="";});}
function openAdmin(){if(curUser!=="MASTER") return alert("Only MASTER"); adminBox.classList.remove('hidden'); db.collection("subscriptions").onSnapshot(s=>{let h=""; s.forEach(d=>{let data=d.data(); let exp=new Date(data.expiry).toLocaleDateString(); let active=Date.now()<data.expiry; let n=data.landlordName||"No Name"; let ph=data.phone||""; let lc=data.location||""; let daysLeft=Math.ceil((data.expiry-Date.now())/(24*3600*1000)); let last=data.lastSeen||"Never"; let cnt=data.loginCount||0; let warn=cnt>20?'⚠️ SHARING?':''; h+=`<div style="border:1px solid #eee;border-radius:10px;padding:10px;margin:8px 0"><div><b>${n}</b> - <b style="color:#7c3aed">${d.id}</b> <span style="color:#ef4444;font-size:11px">${warn}</span><br><small>${ph} | ${lc}<br>Exp: ${exp} (${daysLeft>0?daysLeft+'d left':'EXPIRED'}) <span style="color:${active?'#0f8a5f':'#ef4444'}">${active?'✅':'❌'}</span><br>Logins: <b>${cnt}</b> | Last: ${last}</small></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px"><button class="btn renew" onclick="renewSub('${d.id}')">Renew +30</button><a class="btn" style="background:#25D366;color:#fff;text-align:center;text-decoration:none" href="https://wa.me/254${ph.replace(/^0/,'')}?text=Hello ${encodeURIComponent(n)}, Your KejaChapChap password is ${d.id}. Login at https://mcodoyo.github.io/k" target="_blank">WhatsApp</a><button class="btn logout" onclick="if(confirm('Delete ${n}?')) db.collection('subscriptions').doc('${d.id}').delete()">Del</button></div></div>`}); subsList.innerHTML=h||"<small>No landlords yet</small>";});}
function closeAdmin(){adminBox.classList.add('hidden');}
function createSub(){let name=landlordName.value.trim(), phone=landlordPhone.value.trim(), loc=landlordLocation.value.trim(), p=newPass.value.trim().toUpperCase(), d=Number(newDays.value||30); if(!p) return alert("Enter password"); if(!name) return alert("Enter landlord name!"); let expiry=Date.now()+d*24*3600*1000; db.collection("subscriptions").doc(p).set({landlordName:name,phone,location:loc,expiry,created:Date.now(),days:d,by:"Victor Odoyo",loginCount:0,lastSeen:"Never"}).then(()=>{adminMsg.innerText="✅ Saved "+name+" - "+p; landlordName.value="";landlordPhone.value="";landlordLocation.value="";newPass.value="";});}
function renewSub(id){ if(!confirm('Renew '+id+' for 30 more days?')) return; db.collection("subscriptions").doc(id).get().then(doc=>{ if(!doc.exists) return; let data=doc.data(); let base=Math.max(data.expiry||0, Date.now()); let newExp=base+30*24*3600*1000; db.collection("subscriptions").doc(id).update({expiry:newExp}).then(()=>{adminMsg.innerText="✅ Renewed "+id+" till "+new Date(newExp).toLocaleDateString();}); });}
</script>
</body>
</html>
