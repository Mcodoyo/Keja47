<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Keja47 - All 47 Counties</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f5f7fb}
.header{background:#0f172a;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.btn{background:#0ea5e9;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer}
.btn-outline{background:#fff;border:1px solid #ddd;color:#333}
.container{max-width:1150px;margin:15px auto;padding:0 12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.counties{display:flex;gap:8px;overflow-x:auto;padding:8px 0 12px;white-space:nowrap}
.county{padding:6px 12px;border-radius:20px;background:#e2e8f0;font-size:12px;cursor:pointer;border:none}
.county.active{background:#0f172a;color:#fff}
.input{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin:6px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
.modal.show{display:flex}.modal-box{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.houses{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.house-card{border-left:5px solid #e5e7eb}.paid{border-left-color:#16a34a}.unpaid{border-left-color:#dc2626}
.badge{padding:3px 9px;border-radius:12px;font-size:10px;color:#fff;font-weight:700}.badge.paid{background:#16a34a}.badge.unpaid{background:#dc2626}
.login-screen{height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;padding:20px}
.login-box{background:#fff;padding:28px;border-radius:16px;width:100%;max-width:380px;text-align:center}
.hidden{display:none}
</style></head><body>
<div id="loginScreen" class="login-screen"><div class="login-box">
<h2>Keja47 <span style="color:#0ea5e9">Kenya</span></h2><p style="color:#64748b;margin:8px 0 14px;font-size:13px">All 47 Counties Rental Manager</p>
<input id="loginUser" class="input" value="admin"><input id="loginPass" class="input" type="password" value="1234">
<button class="btn" style="width:100%;margin-top:8px" onclick="login()">LOGIN / INGIA</button>
<p style="font-size:11px;color:#94a3b8;margin-top:10px">0718 255 742 | Garissa - Nairobi - Mombasa</p>
</div></div>
<div id="app" class="hidden">
<div class="header"><h1>Keja47 <span style="color:#38bdf8">47 Counties</span></h1><button class="btn btn-outline" style="padding:5px 10px" onclick="logout()">Logout</button></div>
<div class="container">
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
<button class="btn" onclick="openModal()">+ Ongeza Tenant</button>
<select id="countyFilter" class="input" style="width:auto;flex:1;min-width:140px" onchange="render()"><option value="All">All 47 Counties</option></select>
<button class="btn btn-outline" onclick="shareWA()">WhatsApp Report</button>
</div>
<div class="counties" id="countyChips"></div>
<div class="stats">
<div class="card"><h3 id="totalHouses">0</h3><p style="font-size:12px;color:#64748b">Total Houses</p></div>
<div class="card"><h3 id="paidCount" style="color:#16a34a">0</h3><p style="font-size:12px;color:#64748b">GREEN Paid</p></div>
<div class="card"><h3 id="unpaidCount" style="color:#dc2626">0</h3><p style="font-size:12px;color:#64748b">RED Unpaid</p></div>
<div class="card"><h3 id="totalRent">Ksh 0</h3><p style="font-size:12px;color:#64748b">Collected</p></div>
</div>
<div id="houses" class="houses"></div>
</div>
</div>
<div id="addModal" class="modal"><div class="modal-box">
<h3>Add Tenant - Chagua County</h3>
<select id="countyInput" class="input"></select>
<input id="houseName" class="input" placeholder="Plot / House No. e.g. Bulla A1 / Zimmerman 2B">
<input id="tenantName" class="input" placeholder="Tenant Name">
<input id="phone" class="input" placeholder="Phone">
<input id="rent" class="input" type="number" placeholder="Rent Ksh">
<select id="status" class="input"><option value="paid">GREEN - Amelipa</option><option value="unpaid">RED - Hajalipa</option></select>
<div style="display:flex;gap:8px;margin-top:8px"><button class="btn" style="flex:1" onclick="saveHouse()">Save</button><button class="btn btn-outline" style="flex:1" onclick="closeModal()">Cancel</button></div>
</div></div>
<script>
const counties=["Mombasa","Kwale","Kilifi","Tana River","Lamu","Taita-Taveta","Garissa","Wajir","Mandera","Marsabit","Isiolo","Meru","Tharaka-Nithi","Embu","Kitui","Machakos","Makueni","Nyandarua","Nyeri","Kirinyaga","Murang'a","Kiambu","Turkana","West Pokot","Samburu","Trans Nzoia","Uasin Gishu","Elgeyo-Marakwet","Nandi","Baringo","Laikipia","Nakuru","Narok","Kajiado","Kericho","Bomet","Kakamega","Vihiga","Bungoma","Busia","Siaya","Kisumu","Homa Bay","Migori","Kisii","Nyamira","Nairobi City"];
let houses=JSON.parse(localStorage.getItem('keja47v2')||'[]');
let activeCounty='All';
function initCounties(){
 let f=document.getElementById('countyFilter'), inp=document.getElementById('countyInput'), chips=document.getElementById('countyChips');
 counties.forEach(c=>{
   f.innerHTML+=`<option value="${c}">${c}</option>`;
   inp.innerHTML+=`<option value="${c}" ${c==='Garissa'?'selected':''}>${c}</option>`;
 });
 chips.innerHTML=`<button class="county active" onclick="setCounty('All',this)">All</button>`;
 counties.forEach(c=>{ chips.innerHTML+=`<button class="county" onclick="setCounty('${c}',this)">${c}</button>`; });
}
function setCounty(c, el){
 activeCounty=c;
 document.getElementById('countyFilter').value=c;
 document.querySelectorAll('.county').forEach(b=>b.classList.remove('active'));
 if(el) el.classList.add('active');
 render();
}
function login(){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');initCounties();render();}
function logout(){location.reload();}
function openModal(){document.getElementById('addModal').classList.add('show');}
function closeModal(){document.getElementById('addModal').classList.remove('show');}
function saveHouse(){
 let county=document.getElementById('countyInput').value;
 let h=document.getElementById('houseName').value.trim();
 let t=document.getElementById('tenantName').value.trim();
 let ph=document.getElementById('phone').value.trim();
 let r=parseInt(document.getElementById('rent').value)||0;
 let s=document.getElementById('status').value;
 if(!h||!t){alert('Jaza Plot na Jina');return;}
 houses.push({id:Date.now(), county, house:h, tenant:t, phone:ph, rent:r, status:s});
 localStorage.setItem('keja47v2', JSON.stringify(houses));
 closeModal(); render();
}
function toggleStatus(id){houses=houses.map(x=> x.id===id ? {...x, status: x.status==='paid'?'unpaid':'paid'}:x);localStorage.setItem('keja47v2', JSON.stringify(houses));render();}
function delHouse(id){if(confirm('Futa?')){houses=houses.filter(x=>x.id!==id);localStorage.setItem('keja47v2', JSON.stringify(houses));render();}}
function render(){
 let c=document.getElementById('houses'); c.innerHTML='';
 let filter=document.getElementById('countyFilter').value;
 if(filter) activeCounty=filter;
 let list = activeCounty==='All' ? houses : houses.filter(h=>h.county===activeCounty);
 let paid=0,unpaid=0,total=0;
 list.forEach(h=>{ if(h.status==='paid'){paid++; total+=h.rent}else unpaid++;});
 document.getElementById('totalHouses').innerText=list.length;
 document.getElementById('paidCount').innerText=paid;
 document.getElementById('unpaidCount').innerText=unpaid;
 document.getElementById('totalRent').innerText='Ksh '+total.toLocaleString();
 list.slice().reverse().forEach(h=>{
  c.innerHTML+=`<div class="card house-card ${h.status}">
   <div style="display:flex;justify-content:space-between"><b>${h.house}</b><span class="badge ${h.status}">${h.status==='paid'?'GREEN':'RED'}</span></div>
   <p style="font-size:13px;margin:4px 0"><b>${h.county}</b> | ${h.tenant} | ${h.phone||''}</p>
   <p style="font-size:13px">Ksh ${h.rent.toLocaleString()}</p>
   <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
    <button class="btn" style="padding:6px 10px;font-size:12px;background:${h.status==='paid'?'#dc2626':'#16a34a'}" onclick="toggleStatus(${h.id})">${h.status==='paid'?'Mark RED':'Mark GREEN'}</button>
    <button class="btn btn-outline" style="padding:6px 10px;font-size:12px" onclick="delHouse(${h.id})">Delete</button>
   </div>
  </div>`;
 });
 if(list.length===0){ c.innerHTML=`<div class="card" style="text-align:center;color:#94a3b8">Hakuna tenant in ${activeCounty}. Add tenant wa ${activeCounty}!</div>`; }
}
function shareWA(){
 let txt=`Keja47 - 47 Counties Report\nCounty: ${activeCounty}\nTotal: ${document.getElementById('totalHouses').innerText}\nPaid: ${document.getElementById('paidCount').innerText}\nUnpaid: ${document.getElementById('unpaidCount').innerText}\nLink: https://mcodoyo.github.io/Keja47/`;
 window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
}
</script>
</body></html>
