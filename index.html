 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KejaChapChap</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<style>
body{font-family:sans-serif;margin:0;background:#f3f4f6}
.header{background:linear-gradient(90deg,#2563eb,#10b981);color:white;padding:15px;display:flex;align-items:center;gap:10px}
.header img{width:45px;height:45px;border-radius:12px;background:white}
.card{background:white;margin:10px;padding:15px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
button{background:#2563eb;color:white;border:0;padding:10px 16px;border-radius:8px;width:100%;font-weight:bold}
input,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
.hidden{display:none}
.house{border:1px solid #eee;padding:10px;border-radius:10px;margin:8px 0}
</style>
</head>
<body>
<div class="header">
<img src="IMG-20260921-WA0618.jpg" alt="logo">
<div><b>KejaChapChap</b><br><small>Pata Keja ChapChap</small></div>
</div>

<div id="auth" class="card">
<h3>Login / Register</h3>
<input id="phone" placeholder="Phone e.g. 0712..." />
<input id="pin" type="password" placeholder="PIN (4 digits)" />
<button onclick="login()">Ingia / Jisajili</button>
<p><small>Hii itasave kwa simu yako, hakuna server needed</small></p>
</div>

<div id="main" class="card hidden">
<h3>Karibu! <span id="userPhone"></span></h3>
<button onclick="logout()" style="background:#ef4444">Logout</button>
<hr>
<h4>Ongeza Nyumba</h4>
<input id="loc" placeholder="Location e.g. Garissa Ndogo">
<input id="price" type="number" placeholder="Rent KES">
<select id="type"><option>Bedsitter</option><option>1 Bedroom</option><option>2 Bedroom</option></select>
<button onclick="addHouse()">Post Nyumba</button>

<div id="houses"></div>
<button id="installBtn" class="hidden" style="background:#10b981;margin-top:15px">📲 Install App kwa Simu</button>
</div>

<script>
// Auth fix
function login(){
 let p=document.getElementById('phone').value;
 let pin=document.getElementById('pin').value;
 if(!p || pin.length<4){alert('Weka phone na PIN 4 digits');return}
 localStorage.setItem('keja_user',p);
 showMain();
}
function logout(){localStorage.removeItem('keja_user');location.reload()}
function showMain(){
 let u=localStorage.getItem('keja_user');
 if(u){
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('main').classList.remove('hidden');
  document.getElementById('userPhone').innerText=u;
  loadHouses();
 }
}
let houses=JSON.parse(localStorage.getItem('keja_houses')||'[]');
function addHouse(){
 let h={loc:loc.value,price:price.value,type:type.value,id:Date.now()};
 if(!h.loc||!h.price){alert('Jaza location na price');return}
 houses.unshift(h);
 localStorage.setItem('keja_houses',JSON.stringify(houses));
 loc.value='';price.value='';loadHouses();
}
function loadHouses(){
 let div=document.getElementById('houses');
 div.innerHTML='<h4>Nyumba Zilizopo ('+houses.length+')</h4>'+houses.map(h=>`<div class=house><b>${h.type}</b> - ${h.loc}<br>Ksh ${h.price}/month <br><small>Contact: ${localStorage.getItem('keja_user')}</small></div>`).join('');
}
showMain();

// PWA install
let deferredPrompt;
const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',(e)=>{
 e.preventDefault();deferredPrompt=e;installBtn.classList.remove('hidden');
});
installBtn.addEventListener('click',async()=>{
 if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.classList.add('hidden')}
});
if('serviceWorker' in navigator){navigator.serviceWorker.register('data:text/javascript;base64,'+btoa('self.addEventListener("fetch",e=>{})'))}
</script>
</body>
</html>
